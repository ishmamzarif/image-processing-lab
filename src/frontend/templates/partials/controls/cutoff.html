{# The cutoff radius, shared by sharpen and edges #}

<div class="field f-cutoff">
    <label class="label" for="cutoff">Cutoff radius <b class="val" id="v-cutoff" aria-hidden="true"></b></label>
    <input type="range" name="cutoff" id="cutoff"
           min="1" max="60" step="1" value="{{ cut }}">
</div>
