{# Decrypt: the passphrase to try.

   Its own field, named "guess" rather than "key": this page is handed a file
   and a string, and has no way of knowing whether the string is the right one.
   A wrong passphrase decrypts just as far and hands back noise. #}

<div class="field f-guess">
    <label class="label" for="guess">Passphrase</label>
    <input class="text" type="text" name="guess" id="guess" spellcheck="false"
           placeholder="cse220" value="{{ key if recovered else '' }}">
</div>
