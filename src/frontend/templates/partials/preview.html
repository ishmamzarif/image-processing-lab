{# --- preview of a freshly picked file, filled in by JS before any run --- #}
<section class="preview" id="preview" hidden>
    <div class="meta">
        <b>Source</b>
        <i>&middot;</i> <span id="preview-dims">&mdash;</span>
        <i>&middot;</i> not processed yet
    </div>
    <div class="pair">
        <div class="plate">
            <div class="plate__bar"><span>Loaded image</span></div>
            <div class="plate__well" data-cap="Loaded image">
                <img id="preview-img" alt="Loaded image">
            </div>
        </div>
    </div>
</section>
